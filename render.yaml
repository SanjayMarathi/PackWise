# Render Blueprint: deploys the published Docker Hub image plus a managed PostgreSQL database.
# Dashboard -> New -> Blueprint -> select this repository.
# Replace DOCKERHUB_USERNAME below with your Docker Hub namespace before applying.
services:
  - type: web
    name: packwise-api
    runtime: image
    image:
      url: docker.io/DOCKERHUB_USERNAME/packwise:latest
    plan: free
    region: singapore
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true          # random 256-bit value, never stored in git
      - key: DATABASE_URL
        fromDatabase:
          name: packwise-db
          property: connectionString
      # Render sets RENDER_EXTERNAL_HOSTNAME automatically; production settings add it to ALLOWED_HOSTS.
      - key: RUN_MIGRATIONS          # free instances have no pre-deploy hook, so migrate on start
        value: "true"
      - key: SEED_DEMO_DATA          # idempotent demo catalogue for reviewers
        value: "true"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: LOG_FORMAT
        value: json

databases:
  - name: packwise-db
    plan: free
    region: singapore
    databaseName: packwise
    user: packwise
    postgresMajorVersion: "17"
