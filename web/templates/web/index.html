{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PackWise · Box Recommendation</title>
  <meta name="description" content="Pick products and PackWise packs them in 3D to find the cheapest shipping box that fits. Includes an AI packing assistant.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23c9a173' d='M4 11l12 6v13L4 24z'/%3E%3Cpath fill='%239c7346' d='M28 11l-12 6v13l12-6z'/%3E%3Cpath fill='%23ead6b8' d='M4 11l12-6 12 6-12 6z'/%3E%3Cpath fill='%2322305a' d='M14 6l4 0 0 24-4-2z'/%3E%3C/svg%3E">
  <link rel="preload" href="{% static 'web/vendor/fonts/fraunces-latin-wght-normal.woff2' %}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{% static 'web/css/app.css' %}">
  <script type="importmap">
    {"imports": {
      "three": "{% static 'web/vendor/three/three.module.min.js' %}",
      "three/addons/controls/OrbitControls.js": "{% static 'web/vendor/three/addons/controls/OrbitControls.js' %}"
    }}
  </script>
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <svg class="blob-blush" viewBox="0 0 200 200"><path fill="currentColor" d="M44 -8C70 -22 120 -20 150 6s44 70 24 104-74 46-112 30S-2 92 6 58 18 6 44 -8z"/></svg>
    <svg class="blob-navy" viewBox="0 0 200 200"><path fill="currentColor" d="M60 20c32-18 88-16 112 18s18 92-14 120-86 34-118 4S-2 92 12 62s16-24 48-42z"/></svg>
    <svg class="blob-caramel" viewBox="0 0 200 200"><path fill="currentColor" d="M100 10a90 90 0 1 1 0 180c-40 0-30-50-60-70S20 10 100 10z"/></svg>
    <svg class="sprig" viewBox="0 0 120 160" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <path d="M60 158C58 110 62 62 78 6"/>
      <path d="M62 128c-20-4-34-18-38-34 18 2 32 14 38 34z"/><path d="M63 128c18-6 30-20 32-36-16 4-28 16-32 36z"/>
      <path d="M64 92c-18-6-30-20-32-36 16 4 28 16 32 36z"/><path d="M66 90c16-8 26-22 26-38-14 6-24 18-26 38z"/>
      <path d="M70 56c-14-6-22-18-22-32 12 4 20 14 22 32z"/><path d="M72 54c12-8 18-20 16-32-10 6-16 16-16 32z"/>
    </svg>
  </div>

  <header class="topbar">
    <a class="brand" href="#/pack" aria-label="PackWise home">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <path class="box-front" d="M4 11l12 6v13L4 24z"/>
        <path class="box-side" d="M28 11l-12 6v13l12-6z"/>
        <path class="box-top" d="M4 11l12-6 12 6-12 6z"/>
        <path class="box-tape" d="M14 6.2l4-.1 0 23.9-4-2z"/>
        <path class="box-leaf" d="M21 23.5c1.2-2.6 3.4-4 5.6-4.2-.6 2.4-2.6 4-5.6 4.2zM21 23.5l3.4-2.4"/>
      </svg>
      <span>PackWise</span>
    </a>
    <nav class="tabs" aria-label="Sections">
      <a href="#/pack" data-route="pack">Pack order</a>
      <a href="#/orders" data-route="orders">Orders</a>
      <a href="#/products" data-route="products">Products</a>
      <a href="#/boxes" data-route="boxes">Boxes</a>
    </nav>
    <div class="topbar-right">
      <span class="health" id="health" title="API status"><span class="dot"></span><span class="label">Checking…</span></span>
      <a class="link-quiet" href="/api/docs/" target="_blank" rel="noopener">API docs ↗</a>
    </div>
  </header>

  <main id="app" class="page" aria-live="polite">
    <noscript>PackWise needs JavaScript. The REST API is available at <a href="/api/docs/">/api/docs/</a>.</noscript>
  </main>

  <div id="assistant-root"></div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <footer class="footer">
    <span>Units: cm · kg · INR</span>
    <span>v{{ version|slice:":12" }}</span>
    <a href="https://github.com/SanjayMarathi/PackWise" target="_blank" rel="noopener">Source</a>
  </footer>

  {{ strategies|json_script:"strategies" }}
  {{ default_strategy|json_script:"default-strategy" }}
  <script type="module" src="{% static 'web/js/app.js' %}"></script>
</body>
</html>
